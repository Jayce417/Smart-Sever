[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart_server"
version = "0.1.0"
description = "A smart server package with FastAPI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "httpx>=0.24.0",
    "numpy>=1.21.0",
    "graphviz>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/yourusername/smart_server"
Repository = "https://github.com/yourusername/smart_server"

[tool.setuptools]
packages = ["smart_server", "smart_choice"]
include-package-data = true

[tool.setuptools.package-data]
smart_server = ["static/**/*", "static/*"]
smart_choice = ["**/*.py"]

[tool.setuptools.package-dir]
"" = "."
"smart_choice" = "smart-choice/smart_choice"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
