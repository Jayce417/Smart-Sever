name: Build Python Wheels

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools

    - name: Build smart-choice wheel
      run: |
        cd smart-choice
        python setup.py bdist_wheel
        echo "✅ Smart-choice wheel built"
        ls -la dist/

    - name: Install smart-choice for dependencies
      run: |
        pip install ./smart-choice/dist/*.whl

    - name: Build smart_server wheel
      run: |
        cd smart_server
        python setup.py bdist_wheel
        echo "✅ Smart_server wheel built"
        ls -la dist/

    - name: Test installations
      run: |
        python -c "import smart_choice; print('✅ Smart-choice imported successfully')"
        python -c "import smart_server; print('✅ Smart_server imported successfully')"

    - name: Upload smart-choice wheel
      uses: actions/upload-artifact@v3
      with:
        name: smart-choice-wheel
        path: smart-choice/dist/*.whl

    - name: Upload smart_server wheel
      uses: actions/upload-artifact@v3
      with:
        name: smart_server-wheel
        path: smart_server/dist/*.whl

    - name: Show build summary
      run: |
        echo "🎉 Build completed successfully!"
        echo "📦 Artifacts uploaded:"
        echo "  - smart-choice wheel: $(ls smart-choice/dist/*.whl)"
        echo "  - smart_server wheel: $(ls smart_server/dist/*.whl)"
